name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: zed-production-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  GOTOOLCHAIN: "local"
  RUST_VERSION: "1.93.0"
  RUST_TARGET: "wasm32-wasip2"
  TRUSTED_RELEASE_KEY: security/release/ed25519-public.pem

jobs:
  validate-source:
    name: Validate source and build unsigned extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      epoch: ${{ steps.metadata.outputs.epoch }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the complete tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable tag and declared extension version
        id: metadata
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$REF_NAME" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' extension.toml)"
          test -f "$TRUSTED_RELEASE_KEY"
          commit="$(git rev-parse --verify "refs/tags/$REF_NAME^{commit}")"
          test "$commit" = "$(git rev-parse --verify 'HEAD^{commit}')"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          test -z "$(git status --porcelain --untracked-files=normal)"
          {
            printf 'commit=%s\n' "$commit"
            printf 'epoch=%s\n' "$(git show -s --format=%ct "$commit")"
            printf 'version=%s\n' "$REF_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: wasm32-wasip2
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify source and release boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          go -C release-tools test ./...
          cargo build --locked --release --target "$RUST_TARGET"
          (cd fixture && go mod download && GOPROXY=off go tool github.com/spice-framework/toolchain/cmd/spice verify --format=json ./...)
      - name: Render deterministic unsigned release
        shell: bash
        env:
          COMMIT: ${{ steps.metadata.outputs.commit }}
          EPOCH: ${{ steps.metadata.outputs.epoch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          input="target/$RUST_TARGET/release/spice_zed.wasm"
          test -f "$input"
          go -C release-tools run ./cmd/editor-release package \
            -root .. -input "../$input" -output ../dist-unsigned \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
      - name: Prove release preparation preserved source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.commit }}
          path: dist-unsigned/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  independent-rebuild:
    name: Independently rebuild extension on Windows
    needs: validate-source
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          targets: wasm32-wasip2
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build and package without signing material
        shell: pwsh
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C release-tools run ./cmd/editor-release package `
            -root .. -input "../target/$env:RUST_TARGET/release/spice_zed.wasm" `
            -output ../dist-rebuilt -version $env:VERSION -commit $env:COMMIT -epoch $env:EPOCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: dist-rebuilt/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-reproducibility:
    name: Verify unsigned Linux and Windows bytes
    needs: [validate-source, independent-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download unsigned Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/unsigned
      - name: Download independent Windows rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/rebuilt
      - name: Require exact unsigned artifact identity
        shell: bash
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find artifacts/unsigned -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find artifacts/rebuilt -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          for name in checksums.txt "spice-zed_${VERSION#v}.zip" "spice-zed_${VERSION#v}_sbom.spdx.json" "spice-zed_${VERSION#v}_provenance.intoto.jsonl"; do
            cmp --silent "artifacts/unsigned/$name" "artifacts/rebuilt/$name"
          done

  sign:
    name: Sign authenticated checksums
    needs: [validate-source, verify-reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-signing
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/unsigned
      - name: Sign with protected Ed25519 key
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          SPICE_EDITOR_RELEASE_SIGNING_KEY: ${{ secrets.SPICE_EDITOR_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$SPICE_EDITOR_RELEASE_SIGNING_KEY"
          go -C release-tools run ./cmd/editor-release sign \
            -root .. -input ../artifacts/unsigned -output ../artifacts/signed \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
      - name: Upload signed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-artifacts:
    name: Independently verify signature and reproducibility
    needs: [validate-source, independent-rebuild, verify-reproducibility, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed
      - name: Download independent rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/rebuilt
      - name: Verify public trust and byte reproducibility
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/signed -output ../unused \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH" | tee verification.txt
          for name in checksums.txt "spice-zed_${VERSION#v}.zip" "spice-zed_${VERSION#v}_sbom.spdx.json" "spice-zed_${VERSION#v}_provenance.intoto.jsonl"; do
            cmp --silent "artifacts/signed/$name" "artifacts/rebuilt/$name"
          done
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: verification.txt
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Reverify and publish under protected approval
    needs: [validate-source, sign, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-publish
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-source.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Download verified signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.commit }}
          path: artifacts/signed
      - name: Reverify, publish, download, and reverify exact assets
        shell: bash
        env:
          COMMIT: ${{ needs.validate-source.outputs.commit }}
          EPOCH: ${{ needs.validate-source.outputs.epoch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/signed -output ../unused \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
          test "$(find artifacts/signed -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq .sha)" = "$COMMIT"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --target "$COMMIT" --title "Spice Zed Extension $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber artifacts/signed/*
          mkdir artifacts/downloaded
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir artifacts/downloaded
          test "$(find artifacts/downloaded -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          for file in artifacts/signed/*; do cmp --silent "$file" "artifacts/downloaded/$(basename "$file")"; done
          go -C release-tools run ./cmd/editor-release verify \
            -root .. -input ../artifacts/downloaded -output ../unused \
            -version "$VERSION" -commit "$COMMIT" -epoch "$EPOCH"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
