name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust and canonical Spice fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: wasm32-wasip2
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: fixture/go.sum
      - name: Require Rust formatting
        run: cargo fmt --check
      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test locked Rust dependencies
        run: cargo test --locked
      - name: Build release extension
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Download the explicit fixture module graph
        working-directory: fixture
        run: go mod download
      - name: Verify fixture without network access
        working-directory: fixture
        env:
          GOPROXY: "off"
        run: >-
          go tool github.com/spice-framework/toolchain/cmd/spice
          verify --format=json ./...
