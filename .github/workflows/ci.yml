name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust and canonical Spice fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
          targets: wasm32-wasip2
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: fixture/go.sum
      - name: Require Rust formatting
        run: cargo fmt --check
      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test locked Rust dependencies
        run: cargo test --locked
      - name: Test deterministic signed release boundary
        run: go -C release-tools test ./...
      - name: Build release extension
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Download the explicit fixture module graph
        working-directory: fixture
        run: go mod download
      - name: Verify fixture without network access
        working-directory: fixture
        env:
          GOPROXY: "off"
        run: >-
          go tool github.com/spice-framework/toolchain/cmd/spice
          verify --format=json ./...

  required:
    name: Required CI
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"
