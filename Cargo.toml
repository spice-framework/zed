[package]
name = "spice-zed"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Zed integration for the Spice Go application framework"
repository = "https://github.com/StevenBuglione/spice"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "=0.7.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
